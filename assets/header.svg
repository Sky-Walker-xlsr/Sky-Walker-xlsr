<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Yannick Salm: Bergkette als Header">
<style>
@keyframes rise { from { opacity: 0; transform: translateY(36px) } to { opacity: 1; transform: none } }
@keyframes draw { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.back { animation: rise 1.2s ease-out both }
.mid { animation: rise 1.2s .2s ease-out both }
.fill { animation: fade 1s 1.6s ease-out both }
.line { stroke-dasharray: 1; animation: draw 2.2s .4s ease-in-out both }
.snow { animation: fade .8s 2.2s ease-out both }
.glow { animation: fade 1.6s 1.4s ease-out both }
.t1 { animation: rise .9s .5s ease-out both }
.t2 { animation: rise .9s .8s ease-out both }
.t3 { animation: rise .9s 1.1s ease-out both }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs><radialGradient id="g"><stop offset="0" stop-color="#c9a97c" stop-opacity=".38"/><stop offset="1" stop-color="#c9a97c" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="380" fill="#0d1117"/>
<circle class="glow" cx="930" cy="120" r="230" fill="url(#g)"/>
<path class="back" fill="#161b22" d="M0 300 L120 275 L240 300 L380 262 L520 285 L660 190 L780 240 L900 150 L1020 210 L1120 170 L1200 220 V380 H0Z"/>
<path class="mid" fill="#1c222b" d="M0 340 L160 310 L300 335 L470 290 L620 325 L760 250 L880 300 L990 235 L1100 290 L1200 260 V380 H0Z"/>
<path class="fill" fill="#0d1117" d="M0 372 L190 345 L330 365 L520 320 L660 350 L790 225 L860 275 L930 62 L1010 170 L1060 140 L1200 250 V380 H0Z"/>
<polygon class="snow" fill="#f2ece1" points="930,62 975,123 950,112 932,138 915,112 901,150"/>
<path class="line" pathLength="1" fill="none" stroke="#c9a97c" stroke-width="3" stroke-linejoin="round" d="M0 372 L190 345 L330 365 L520 320 L660 350 L790 225 L860 275 L930 62 L1010 170 L1060 140 L1200 250"/>
<text class="t1" x="70" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#f2ece1">Yannick Salm</text>
<text class="t2" x="72" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#f2ece1" opacity=".85">IT-Lernender aus der Schweiz</text>
<text class="t3" x="72" y="214" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="20" fill="#c9a97c">Web-Apps · Homelab · Cloudflare</text>
</svg>
